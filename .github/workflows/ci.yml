name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Primary unit-test matrix — catches Windows path/encoding/line-ending
  # regressions that Linux-only CI misses. macos-latest included so the
  # bash launcher suite (upgrade-check.test.cjs) gets a non-Linux run too.
  # Windows skips upgrade-check.test.cjs (requires bash); everything else
  # is pure Node and must pass on all three.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run cross-platform unit tests
        run: node tests/base.test.cjs && node tests/schema.test.cjs && node tests/providers.test.cjs && node tests/compat.test.cjs

      - name: Run bash-dependent tests (Unix only)
        if: runner.os != 'Windows'
        run: node tests/upgrade-check.test.cjs

      - name: Build patched binary
        run: node pipeline/patch.cjs

      - name: Build integrity tests (post-build)
        run: node tests/build-integrity.test.cjs
