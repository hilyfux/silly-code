name: release

# Fires on push to main. If deps.json's upstream.version changed vs the
# previous commit, build the patched tarball and cut a release on the PUBLIC
# mirror (hilyfux/silly-code). The release asset silly-code.tar.gz is what
# install.sh / install.ps1 download from releases/latest.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'deps.json'
      - 'pipeline/upstream/package/cli.js'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force release for a specific version (leave empty to auto-detect)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_REPO: hilyfux/silly-code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Prophylactic: future annotated-tag or signed-commit steps will fail with
      # "empty ident name" without this. See lesson 7293857 (upstream-upgrade.yml
      # hit this; release.yml uses `gh release create` today but we set identity
      # now so the next addition of a git op doesn't trip the same wire).
      - name: Configure git identity
        run: |
          git config user.name  "silly-code-bot"
          git config user.email "silly-code-bot@users.noreply.github.com"

      - name: Detect version change
        id: diff
        run: |
          set -euo pipefail
          FORCE="${{ github.event.inputs.force_version }}"
          if [ -n "$FORCE" ]; then
            echo "new=$FORCE" >> $GITHUB_OUTPUT
            echo "old=(forced)" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          OLD=$(git show HEAD^:deps.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).deps.upstream.version" 2>/dev/null || echo "")
          NEW=$(node -p "require('./deps.json').deps.upstream.version")
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          if [ "$OLD" = "$NEW" ] || [ -z "$NEW" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Check tag does not already exist on public mirror
        if: steps.diff.outputs.changed == 'true'
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.diff.outputs.new }}"
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists on $PUBLIC_REPO — skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build patched binary + run tests
        if: steps.diff.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          node pipeline/patch.cjs
          node tests/base.test.cjs
          node tests/schema.test.cjs

      - name: Package release tarball
        if: steps.diff.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: node pipeline/package-release.cjs

      - name: Create release on public mirror
        if: steps.diff.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail
          NEW="${{ steps.diff.outputs.new }}"
          OLD="${{ steps.diff.outputs.old }}"
          CHANGELOG_URL="https://github.com/anthropics/claude-code/releases/tag/v${NEW}"

          NOTES="$(cat <<EOF
          **Upstream: Claude Code \`${OLD}\` → \`${NEW}\`**

          Patched downstream by silly-code with:
          - 3 providers (Claude / OpenAI Codex / GitHub Copilot)
          - zero telemetry (10 endpoints blocked)
          - zero tier gating
          - identity purity for third-party providers

          ### Install / upgrade

          **macOS / Linux**

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/hilyfux/silly-code/main/install.sh | bash
          \`\`\`

          **Windows PowerShell**

          \`\`\`powershell
          irm https://raw.githubusercontent.com/hilyfux/silly-code/main/install.ps1 | iex
          \`\`\`

          ### Upstream notes
          [Claude Code ${NEW} release notes](${CHANGELOG_URL})
          EOF
          )"

          gh release create "v${NEW}" \
            --repo "$PUBLIC_REPO" \
            --title "silly-code v${NEW}" \
            --notes "$NOTES" \
            silly-code.tar.gz

      - name: Summary
        if: always()
        run: |
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Old version | \`${{ steps.diff.outputs.old }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| New version | \`${{ steps.diff.outputs.new }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Changed? | ${{ steps.diff.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag existed? | ${{ steps.tag_check.outputs.exists || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`$PUBLIC_REPO\` |" >> $GITHUB_STEP_SUMMARY
