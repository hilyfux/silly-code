name: sync-installer

# Mirror installer/* → repo root so the install URL
#   raw.githubusercontent.com/hilyfux/silly-code/main/install.sh
# stays current. Source of truth lives at installer/; root files are
# regenerated copies maintained by this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'installer/install.sh'
      - 'installer/install.ps1'
      - 'installer/uninstall.sh'
      - 'installer/uninstall.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy installer/* to root
        run: |
          set -euo pipefail
          cp installer/install.sh      install.sh
          cp installer/install.ps1     install.ps1
          cp installer/uninstall.sh    uninstall.sh
          cp installer/uninstall.ps1   uninstall.ps1

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          git config user.name  "silly-code-bot"
          git config user.email "silly-code-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — nothing to mirror"
            exit 0
          fi
          SHA=$(git rev-parse --short HEAD)
          git add install.sh install.ps1 uninstall.sh uninstall.ps1
          git commit -m "chore: mirror installer/ → root@${SHA}"
          git push
