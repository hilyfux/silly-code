name: upstream-upgrade

# Daily unattended check for @anthropic-ai/claude-code releases.
#
# Pipeline:
#   1. ci-upgrade.cjs inspects npm for a newer version
#   2. If new version + patches auto-fix cleanly + tests green → open PR
#   3. If new version but patches fail after auto-fix       → open Issue
#   4. If already current                                    → no-op
#
# PRs are NOT auto-merged. A maintainer reviews before the change lands on
# main, where the release workflow takes over to tag the version.

on:
  schedule:
    # 06:07 + 22:07 UTC — targets upstream's two release waves (00-05 + 18-21 UTC)
    # Fallback watchdog; local launchd is primary. Once/day cadence = ~1-2 upgrades/day.
    - cron: '7 6,22 * * *'
  workflow_dispatch:         # manual trigger: "Run workflow" button

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-upgrade
  cancel-in-progress: false  # never cancel a mid-flight upgrade

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can create branches

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name "silly-code-bot"
          git config user.email "silly-code-bot@users.noreply.github.com"

      - name: Run ci-upgrade
        id: up
        continue-on-error: true
        run: node pipeline/ci-upgrade.cjs

      - name: Read knowledge-graph snapshot
        id: kg
        if: always()
        run: |
          if [ -f .knowledge-graph/work-snapshot.md ]; then
            {
              echo 'summary<<EOF'
              cat .knowledge-graph/work-snapshot.md
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'summary=' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute branch name
        if: steps.up.outputs.status == 'upgraded'
        id: branch
        run: echo "name=auto/upgrade-${{ steps.up.outputs.latest }}" >> $GITHUB_OUTPUT

      - name: Commit + push upgrade branch
        if: steps.up.outputs.status == 'upgraded'
        run: |
          git checkout -B "${{ steps.branch.outputs.name }}"
          git add -A
          git status --short
          git commit -m "chore: auto-upgrade upstream to ${{ steps.up.outputs.latest }}

          Automated upgrade from ${{ steps.up.outputs.current }} to ${{ steps.up.outputs.latest }}.
          All 82 patches verified, unit tests green.

          See pipeline/varmap-${{ steps.up.outputs.latest }}.json for any variable renames
          applied during the sweep.

          Generated by .github/workflows/upstream-upgrade.yml"
          git push -f origin "${{ steps.branch.outputs.name }}"

      - name: Open / update PR
        if: steps.up.outputs.status == 'upgraded'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --head "${{ steps.branch.outputs.name }}" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "Automated upgrade from \`${{ steps.up.outputs.current }}\` → \`${{ steps.up.outputs.latest }}\`.

          ### Verification
          - patched build green
          - \`tests/base.test.cjs\` passing
          - \`tests/schema.test.cjs\` passing
          - \`tests/providers.test.cjs\` passing

          ### Recent learnings
          ${{ steps.kg.outputs.summary || 'No upgrade snapshot recorded yet.' }}

          ### Next steps
          1. Review the varmap diff in \`pipeline/varmap-${{ steps.up.outputs.latest }}.json\`
          2. Smoke-test \`sillyx -p 'hello'\` / \`sillye\` locally
          3. Merge to trigger the release workflow

          _Workflow: upstream-upgrade.yml · re-run: \`gh workflow run upstream-upgrade\`_"
          else
            gh pr create \
              --head "${{ steps.branch.outputs.name }}" \
              --base main \
              --title "chore: upgrade upstream to ${{ steps.up.outputs.latest }}" \
              --body "Automated upgrade from \`${{ steps.up.outputs.current }}\` → \`${{ steps.up.outputs.latest }}\`.

          ### Verification
          - patched build green
          - \`tests/base.test.cjs\` passing
          - \`tests/schema.test.cjs\` passing
          - \`tests/providers.test.cjs\` passing

          ### Recent learnings
          ${{ steps.kg.outputs.summary || 'No upgrade snapshot recorded yet.' }}

          ### Next steps
          1. Review the varmap diff in \`pipeline/varmap-${{ steps.up.outputs.latest }}.json\`
          2. Smoke-test \`sillyx -p 'hello'\` / \`sillye\` locally
          3. Merge to trigger the release workflow

          _Workflow: upstream-upgrade.yml_"
          fi

      - name: Open / update Issue (auto-fix failed)
        if: steps.up.outputs.status == 'broken' || steps.up.outputs.status == 'tests-failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="upstream ${{ steps.up.outputs.latest }}: auto-upgrade failed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          BODY="$(cat <<EOF
          Automatic upgrade from \`${{ steps.up.outputs.current }}\` → \`${{ steps.up.outputs.latest }}\` could not complete cleanly.

          **Status:** \`${{ steps.up.outputs.status }}\`
          **Failing patches (${{ steps.up.outputs.failing_count }}):**
          \`\`\`
          ${{ steps.up.outputs.failing_list }}
          \`\`\`

          ### Recent learnings
          ${{ steps.kg.outputs.summary || 'No upgrade snapshot recorded yet.' }}

          ### To reproduce locally

          \`\`\`bash
          git pull
          node pipeline/ci-upgrade.cjs       # same failure
          node pipeline/upgrade.cjs fetch    # interactive tools for fixing
          node pipeline/patch.cjs            # build + verify
          \`\`\`

          ### Common fixes for rename failures
          1. \`node pipeline/upgrade.cjs scan pipeline/upstream/package/cli.js\` shows new variable names
          2. Compare to \`pipeline/varmap-${{ steps.up.outputs.current }}.json\`
          3. Update MATCH constants in \`pipeline/patches/provider-engine.cjs\` / \`equality.cjs\` / \`privacy.cjs\`
          4. Push to \`auto/upgrade-${{ steps.up.outputs.latest }}\` to link PR to this Issue

          _Generated by .github/workflows/upstream-upgrade.yml_
          EOF
          )"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "auto-upgrade,upstream"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Upstream upgrade check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Current | \`${{ steps.up.outputs.current }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest | \`${{ steps.up.outputs.latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${{ steps.up.outputs.status || 'unchanged' }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.up.outputs.failing_list }}" ]; then
            echo "| Failing | \`${{ steps.up.outputs.failing_list }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
